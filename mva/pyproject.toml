[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mva"
version = "0.4.0"
description = "Núcleo determinístico para análise de eventos de manufatura"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pandas", "numpy"]

[project.optional-dependencies]
video = ["opencv-python-headless"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest", "httpx", "opencv-python-headless", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
mva = "mva.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mva = ["webapp/static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
