[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mva"
version = "0.1.0"
description = "Núcleo determinístico para análise de eventos de manufatura"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pandas", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "opencv-python-headless"]
video = ["opencv-python-headless"]

[project.scripts]
mva = "mva.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
