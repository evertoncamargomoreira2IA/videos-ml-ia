<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVA — Validação</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dce2ea;--accent:#2456c6;--ok:#15803d;--warn:#a16207;--bad:#dc2626;
 --va:#16a34a;--nnva:#eab308;--insp:#eab308;--wait:#ef4444;--search:#ef4444;--motion:#eab308;--transp:#eab308;--rework:#ef4444;--other:#9aa3b2;
 font-family:system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
*{box-sizing:border-box}body{margin:0}
header{background:#172033;color:#fff;padding:14px max(20px,calc((100vw - 1260px)/2));display:flex;align-items:center;gap:24px;min-height:62px}
header a{color:#fff;text-decoration:none;font-weight:650;font-size:17px}header span{color:#aab4c5;font-size:13px}header nav{display:flex;gap:8px;margin-left:auto}header nav a{font-size:13px;padding:8px 12px;border-radius:8px;color:#cbd5e1}header nav a:hover,header nav a.active{background:#334155;color:#fff}
main{max-width:1300px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px #1720330a}
.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block;transition:background .15s,box-shadow .15s,transform .15s}button:hover,.btn:hover{box-shadow:0 3px 10px #17203318;transform:translateY(-1px)}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.ok{border-color:var(--ok);color:var(--ok)}button.bad{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink);width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #edf0f4;padding:7px 8px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:#eef2f8;color:var(--muted)}
.pill.ok{background:#e3f4ea;color:var(--ok)}.pill.warn{background:#fdf1dc;color:var(--warn)}.pill.bad{background:#fbe5e2;color:var(--bad)}.pill.acc{background:#e5edfb;color:var(--accent)}
.kpi{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px}.kpi:nth-child(4n+1){border-left-color:var(--va)}.kpi:nth-child(4n+2){border-left-color:var(--nnva)}.kpi:nth-child(4n+3){border-left-color:var(--accent)}.kpi b{display:block;font-size:25px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--muted)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.step{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff}.step.done{border-color:#9fd3b4;background:#f1faf4}.step.todo{border-style:dashed}
.list-item{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f4}.list-item:last-child{border:0}.list-item a{color:var(--ink);font-weight:600;text-decoration:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
svg text{font-family:inherit}.chart-wrap{overflow-x:auto}
.table-wrap{overflow-x:auto;max-width:100%}.activity-table{min-width:850px}.activity-table input,.activity-table select{min-width:90px}.activity-table input[type=color]{min-width:44px;width:48px;padding:3px;height:36px}.activity-bars{display:grid;gap:10px}.activity-bar{display:grid;grid-template-columns:minmax(90px,180px) 1fr 78px;gap:10px;align-items:center}.activity-bar .track{height:14px;border-radius:99px;background:#eef2f7;overflow:hidden}.activity-bar .fill{height:100%;border-radius:99px}.activity-bar .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;bottom:18px;right:18px;background:#172033;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:420px}.toast.show{opacity:1}
.fb-done{font-size:12px}.err{color:var(--bad)}
@media (max-width:640px){main{padding:12px}header{padding:12px;gap:10px}header nav{width:100%;margin:0}header span{display:none}.card{padding:15px}.activity-bar{grid-template-columns:minmax(74px,100px) 1fr 64px;font-size:12px}.steps{display:grid;grid-template-columns:1fr 1fr}.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:380px){main{padding:9px}.card{padding:12px}.activity-bar{grid-template-columns:75px 1fr 56px;gap:6px}}
/* Sprint 4b app shell */
:root{--bg:#f1f5f9;--accent:#2563eb}body{background:#f1f5f9;overflow-x:hidden}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;background:#0f172a;color:#e2e8f0;z-index:20;display:flex;flex-direction:column;padding:22px 14px}.brand{padding:0 12px 24px}.brand b{font-size:22px;color:white}.brand small{display:block;color:#94a3b8;margin-top:4px}.side-nav{display:grid;gap:5px}.side-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:#cbd5e1;text-decoration:none}.side-nav a:hover,.side-nav a.active{background:#1e293b;color:white}.side-nav a.active{box-shadow:inset 3px 0 #3b82f6}.side-nav svg{width:18px;height:18px;flex:none}.nav-caption{font-size:10px;letter-spacing:.12em;color:#64748b;padding:22px 12px 6px}.side-foot{margin-top:auto;border-top:1px solid #263244;padding:14px 10px 0;color:#94a3b8;font-size:11px;overflow-wrap:anywhere}.workspace{margin-left:260px;min-height:100vh}.topbar{height:60px;background:white;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 28px;gap:15px;position:sticky;top:0;z-index:10}.top-title{font-weight:650;font-size:16px}.top-user{margin-left:auto;color:#64748b}.topbar .gear{padding:7px 11px}.hamb{display:none;padding:6px 10px}main{max-width:1440px;padding:24px 28px;margin:0 auto}.card{box-shadow:0 5px 18px #0f172a0a}.table-wrap{overflow-x:auto}.table-wrap table{min-width:700px}.demo-banner{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;padding:12px 15px;border-radius:10px;margin:12px 0}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:8px 0 16px;overflow-x:auto}.tabs button{white-space:nowrap;border:0;border-radius:8px 8px 0 0}.tabs button.active{color:#1d4ed8;background:#eff6ff;border-bottom:2px solid #2563eb}.hide{display:none!important}.filter-row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,260px);gap:10px;margin:12px 0}.stat-kpi{background:#fff}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.workspace{margin-left:0}.hamb{display:block}.side-overlay{display:none;position:fixed;inset:0;background:#0f172a70;z-index:19}.side-overlay.show{display:block}.topbar{padding:0 14px}main{padding:16px}}
@media(max-width:600px){.top-user{display:none}.filter-row{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}main{padding:12px}.top-title{font-size:14px}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar"><div class="brand"><b>MVA</b><small>Análise de vídeo de manufatura</small></div><nav class="side-nav"><a href="#/" data-nav="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="5"/><rect x="13" y="10" width="8" height="11"/><rect x="3" y="13" width="8" height="8"/></svg>Painel</a><a href="#/analises" data-nav="analises"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg>Análises</a><a href="#/nova" data-nav="nova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Nova análise</a><div class="nav-caption">CADASTROS</div><a href="#/atividades" data-nav="atividades">◈ <span>Atividades</span></a><a href="#/postos" data-nav="postos">▦ <span>Postos</span></a></nav><div class="side-foot"><div id="sideVersion">MVA</div><div id="sideData"></div></div></aside><div class="side-overlay" id="sideOverlay"></div><div class="workspace"><div class="topbar"><button class="hamb" id="hamb" aria-label="Abrir menu">☰</button><div class="top-title" id="pageTitle">Painel</div><div class="top-user" id="topUser"></div><a class="btn gear" href="#/configuracoes" title="Configurações">⚙ Configurações</a></div><main id="app"></main></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
const $app=document.getElementById('app');
const BUCKET_COLORS={'VA':'--va','NNVA':'--nnva','NVA':'--bad','Outros':'--other','Necessary NVA':'--nnva','Inspection':'--nnva','Waiting':'--bad','Search':'--bad','Motion':'--nnva','Transportation':'--nnva','Rework':'--bad','Other':'--other'};
const ANOMALY_LABEL={above_takt:'Ciclo acima do takt',above_standard_ct:'Ciclo acima do CT padrão',excessive_search:'Busca excessiva',excessive_waiting:'Espera excessiva',rework_debug:'Retrabalho/debug',incomplete_cycle:'Ciclo incompleto',mad_outlier:'Outlier estatístico (MAD)'};
const CLASS_LABEL={below:['abaixo do takt','ok'],near:['próximo do takt','acc'],above:['acima do takt','warn'],severely_above:['muito acima do takt','bad']};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=1)=>v==null||!Number.isFinite(+v)?'—':(+v).toFixed(d).replace('.',',');
const color=b=>`var(${BUCKET_COLORS[b]||'--other'})`;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3500)}
async function api(path,opts={}){const r=await fetch(path,opts);const ct=r.headers.get('content-type')||'';const body=ct.includes('json')?await r.json():await r.text();if(!r.ok)throw new Error(body.detail?(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail)):r.status);return body}
function author(){try{return localStorage.getItem('mva-author')||''}catch(e){return''}}
function setAuthor(v){try{localStorage.setItem('mva-author',v)}catch(e){}}

// Sprint 4b supplemental views and shell state.
let appSettings={}, appInfo={}, appStations=[];
const postJson=(path,obj,method='PUT')=>api(path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
// ---------- Charts (SVG) ----------
function ctChart(m){
 const cyc=m.cycles.filter(c=>c.complete),takt=m.takt.takt_time_seconds;if(!cyc.length)return'<p class="muted">Sem ciclos completos.</p>';
 const W=Math.max(520,cyc.length*46+70),H=230,pl=44,pb=34,pt=12,std=m.takt.standard_cycle_time_seconds,max=Math.max(takt,std||0,...cyc.map(c=>c.duration))*1.15,bw=Math.min(34,(W-pl-10)/cyc.length*.7);
 const y=v=>pt+(H-pt-pb)*(1-v/max),x=i=>pl+(i+.5)*(W-pl-10)/cyc.length;
 const ticks=[0,.25,.5,.75,1].map(f=>f*max);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${W>640?Math.round(W*.7):0}px;max-height:${H+40}px" role="img" aria-label="Cycle time por ciclo">`;
 ticks.forEach(t=>s+=`<line x1="${pl}" x2="${W-10}" y1="${y(t)}" y2="${y(t)}" stroke="#edf0f4"/><text x="${pl-6}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="#5d6b82">${Math.round(t)}</text>`);
 cyc.forEach((c,i)=>{const cls=c.comparison?.classification;const fill=cls==='severely_above'?'var(--bad)':cls==='above'?'var(--wait)':'var(--va)';
  s+=`<rect x="${x(i)-bw/2}" y="${y(c.duration)}" width="${bw}" height="${y(0)-y(c.duration)}" fill="${fill}" rx="3"><title>${c.cycle_id}: ${num(c.duration)} s</title></rect><text x="${x(i)}" y="${y(c.duration)-4}" font-size="11" text-anchor="middle">${num(c.duration)}</text><text x="${x(i)}" y="${H-pb+15}" font-size="11" text-anchor="middle" fill="#5d6b82">${c.cycle_id.replace('cycle_','C')}</text>`});
 s+=`<line x1="${pl}" x2="${W-10}" y1="${y(takt)}" y2="${y(takt)}" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-12}" y="${y(takt)-5}" font-size="11" text-anchor="end" fill="var(--bad)">Takt ${num(takt)} s</text>${std?`<line x1="${pl}" x2="${W-10}" y1="${y(std)}" y2="${y(std)}" stroke="var(--ok)" stroke-dasharray="2 3" stroke-width="2"/><text x="${pl+4}" y="${y(std)-5}" font-size="11" fill="var(--ok)">CT padrão ${num(std)} s</text>`:''}</svg>`;
 return `<div class="chart-wrap">${s}</div><div class="legend"><span><i style="background:var(--va)"></i>até o takt (+5%)</span><span><i style="background:var(--wait)"></i>acima</span><span><i style="background:var(--bad)"></i>muito acima (&gt;120%)</span><span style="color:var(--bad)">- - takt</span>${m.takt.standard_cycle_time_seconds?'<span style="color:var(--ok)">··· CT padrão</span>':''}</div>`;
}
function yamazumiChart(m){
 const ids=Object.keys(m.yamazumi).filter(id=>m.yamazumi[id].cycle_time!=null);if(!ids.length)return'<p class="muted">Sem ciclos completos.</p>';
 const buckets=['VA','NNVA','NVA','Outros'];
 const cols=[...ids.map(id=>({id,label:id.replace('cycle_','C'),b:m.yamazumi[id].buckets})),{id:'avg',label:'Média',b:m.yamazumi_average}];
 const takt=m.takt.takt_time_seconds,W=Math.max(520,cols.length*50+70),H=250,pl=44,pb=34,pt=12;
 const max=Math.max(takt,...cols.map(c=>Object.values(c.b).reduce((a,v)=>a+v,0)))*1.12,bw=Math.min(36,(W-pl-10)/cols.length*.7);
 const y=v=>pt+(H-pt-pb)*(1-v/max),x=i=>pl+(i+.5)*(W-pl-10)/cols.length;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${W>640?Math.round(W*.7):0}px;max-height:${H+40}px" role="img" aria-label="Yamazumi por ciclo">`;
 [0,.25,.5,.75,1].map(f=>f*max).forEach(t=>s+=`<line x1="${pl}" x2="${W-10}" y1="${y(t)}" y2="${y(t)}" stroke="#edf0f4"/><text x="${pl-6}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="#5d6b82">${Math.round(t)}</text>`);
 cols.forEach((c,i)=>{let acc=0;buckets.forEach(b=>{const v=c.b[b]||0;if(!v)return;s+=`<rect x="${x(i)-bw/2}" y="${y(acc+v)}" width="${bw}" height="${y(acc)-y(acc+v)}" fill="${color(b)}" stroke="#fff" stroke-width="1"><title>${c.label} · ${b}: ${num(v)} s</title></rect>`;acc+=v});
  s+=`<text x="${x(i)}" y="${y(acc)-4}" font-size="11" text-anchor="middle">${num(acc)}</text><text x="${x(i)}" y="${H-pb+15}" font-size="11" text-anchor="middle" fill="#5d6b82" ${c.id==='avg'?'font-weight="600"':''}>${c.label}</text>`});
 s+=`<line x1="${pl}" x2="${W-10}" y1="${y(takt)}" y2="${y(takt)}" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-12}" y="${y(takt)-5}" font-size="11" text-anchor="end" fill="var(--bad)">Takt</text></svg>`;
 const vc=m.catalog?.value_classes||{};return `<div class="chart-wrap">${s}</div><div class="legend">${buckets.map((b,i)=>`<span><i style="background:${color(b)}"></i>${b==='VA'?(vc.VA||'Agrega valor (VA)'):b==='NNVA'?(vc.NNVA||'NVA necessário'):b==='NVA'?(vc.NVA||'Desperdício (NVA)'):'Outros'}</span>`).join('')}</div>`;
}

function activityChart(m){
 const rows=m.activities||[];if(!rows.length)return '<p class="muted">Sem atividades rotuladas.</p>';
 const catalog=m.catalog?.activities||[],byCode=Object.fromEntries(catalog.map(a=>[a.code,a])),max=Math.max(0.01,...rows.map(a=>+a.mean_per_cycle_seconds||0));
 const cls={VA:'Agrega valor (VA)',NNVA:'NVA necessário',NVA:'Desperdício (NVA)'};
 return `<div class="activity-bars">${rows.slice().sort((a,b)=>(b.mean_per_cycle_seconds||0)-(a.mean_per_cycle_seconds||0)).map(a=>{const meta=byCode[a.code]||{},v=+a.mean_per_cycle_seconds||0,c=meta.color||({VA:'#16a34a',NNVA:'#eab308',NVA:'#ef4444'}[meta.value_class]||'#9aa3b2');return `<div class="activity-bar"><span class="label" title="${esc(a.label)}">${esc(a.label)}</span><div class="track"><div class="fill" style="width:${Math.max(1,v/max*100)}%;background:${esc(c)}"></div></div><span>${num(v)} s <small class="muted">${esc(cls[meta.value_class]||'Outros')}</small></span></div>`}).join('')}</div>`;
}

async function viewActivities(){
 const data=await api('/api/catalog');let activities=data.activities||[];
 const className={VA:'Agrega valor (VA)',NNVA:'NVA necessário',NVA:'Desperdício (NVA)'},roles=data.roles||{'':'—',wait:'Espera',search:'Busca',rework:'Retrabalho'};
 const row=a=>`<tr><td><input type="color" data-k="color" value="${esc(a.color||'#9aa3b2')}"></td><td><input data-k="label" value="${esc(a.label)}"></td><td><input data-k="code" value="${esc(a.code)}"></td><td><select data-k="value_class">${['VA','NNVA','NVA'].map(c=>`<option value="${c}" ${a.value_class===c?'selected':''}>${className[c]}</option>`).join('')}</select></td><td><input data-k="key" maxlength="1" value="${esc(a.key||'')}"></td><td><select data-k="role">${Object.entries(roles).map(([k,v])=>`<option value="${esc(k)}" ${a.role===k?'selected':''}>${esc(v)}</option>`).join('')}</select></td><td><input data-k="description" value="${esc(a.description||'')}"></td><td><button class="bad" data-remove>Excluir</button></td></tr>`;
 $app.innerHTML=`<h1>Atividades</h1><p class="muted">VA agrega valor, NVA necessário (movimentação, inspeção), desperdício (espera, procura).</p><section class="card"><div class="table-wrap"><table class="activity-table"><thead><tr><th>Cor</th><th>Rótulo</th><th>Código</th><th>Classe</th><th>Tecla</th><th>Papel</th><th>Descrição</th><th></th></tr></thead><tbody id="activityRows">${activities.map(row).join('')}</tbody></table></div><p class="err" id="catalogError"></p><div class="row"><button id="addActivity">+ Nova atividade</button><span class="spacer"></span><button id="resetCatalog">Restaurar padrão</button><button class="primary" id="saveCatalog">Salvar</button></div></section>`;
 const body=document.getElementById('activityRows');body.onclick=e=>{if(e.target.closest('[data-remove]'))e.target.closest('tr').remove()};
 document.getElementById('addActivity').onclick=()=>{const label='Nova atividade',code=slug(label);body.insertAdjacentHTML('beforeend',row({label,code,value_class:'VA',color:'#16a34a',key:'',role:'',description:''}));};
 document.getElementById('saveCatalog').onclick=async()=>{const values=[...body.rows].map(tr=>Object.fromEntries([...tr.querySelectorAll('[data-k]')].map(el=>[el.dataset.k,el.value])));try{await api('/api/catalog',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({activities:values})});toast('Catálogo salvo');route()}catch(e){document.getElementById('catalogError').textContent=e.message}};
 document.getElementById('resetCatalog').onclick=async()=>{if(!confirm('Restaurar o catálogo padrão?'))return;try{await api('/api/catalog/reset',{method:'POST'});toast('Catálogo padrão restaurado');route()}catch(e){document.getElementById('catalogError').textContent=e.message}};
}
function slug(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')||'atividade'}

// ---------- Detalhe ----------
async function viewAnalysisLegacy(id){
 const [a,feedback]=await Promise.all([api(`/api/analyses/${id}`),api(`/api/analyses/${id}/feedback`)]);
 let m=null;if(a.analyzed)m=await api(`/api/analyses/${id}/results`);
 const last={};feedback.forEach(f=>last[f.target_type+':'+f.target_id]=f);
 const th=a.thresholds||{};
 const stepCls=ok=>ok?'step done':'step todo';
 $app.innerHTML=`<div class="row"><div><a href="#/" class="muted" style="text-decoration:none">← Análises</a><h1>${esc(a.name)}</h1><div class="muted">${esc(a.station_id)}${a.operator_id?' · operador '+esc(a.operator_id):''}${a.product_id?' · '+esc(a.product_id):''}</div></div><span class="spacer"></span><button class="bad" id="del">Excluir análise</button></div>
 <div class="steps"><div class="${stepCls(a.has_video)}">1. Vídeo ${a.has_video?'✓':''}</div><div class="${stepCls(a.event_count)}">2. Eventos rotulados ${a.event_count?'('+a.event_count+')':''}</div><div class="${stepCls(a.analyzed&&!a.result_stale)}">3. Análise ${a.result_stale?'(desatualizada)':a.analyzed?'✓':''}</div><div class="${stepCls(a.feedback_count)}">4. Sua validação ${a.feedback_count?'('+a.feedback_count+')':''}</div></div>
 <div class="grid g2">
 <section class="card"><h2>1–2. Vídeo e eventos</h2>
  <p>${a.has_video?`Vídeo: <b>${esc(a.video_filename)}</b>`:'<span class="muted">Sem vídeo ainda.</span>'}</p>
  <div class="row"><a class="btn primary" href="/labeler/${id}">Abrir rotulagem</a>
  <label class="btn">${a.has_video?'Trocar':'Enviar'} vídeo<input type="file" id="vid" accept="video/*" hidden></label>
  <label class="btn">Importar CSV de eventos<input type="file" id="csv" accept=".csv,text/csv" hidden></label>
  ${a.has_events?`<a class="btn" href="/api/analyses/${id}/events" download="${id}_events.csv">Baixar CSV</a>`:''}</div>
  <p class="muted">Atalhos: <b>S/E</b> início/fim do ciclo, <b>I/O</b> início/fim do intervalo, teclas das atividades para rotular, <b>←/→</b> avançar um frame. Salva sozinho.</p>
  <div class="dataset-box" style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px"><h3>Dataset para Machine Learning</h3><div class="row"><label class="f" style="width:160px">1 a cada N frames<input type="number" id="datasetStep" min="1" step="1" value="5"></label><button class="primary" id="exportDataset" ${a.has_video?'':'disabled'}>Exportar frames rotulados</button><span class="muted" id="datasetStatus">Carregando resumo…</span></div><div id="datasetSummary" class="muted" style="margin-top:8px"></div></div>
 </section>
 <section class="card"><h2>Parâmetros</h2><form id="params"><div class="fields">
  <label class="f">Takt Time (s)<input name="takt_time_seconds" type="number" step="any" min="0.01" required value="${a.takt_time_seconds}"></label>
  <label class="f">Cycle Time padrão (s)<input name="standard_cycle_time_seconds" type="number" step="any" min="0.01" placeholder="opcional" value="${a.standard_cycle_time_seconds??''}"></label>
  <label class="f">Limite de busca (s)<input name="search_seconds" type="number" step="any" min="0" value="${th.search_seconds??5}"></label>
  <label class="f">Limite de espera (s)<input name="waiting_seconds" type="number" step="any" min="0" value="${th.waiting_seconds??5}"></label>
  <label class="f">Faixa "próximo do takt" (%)<input name="near_pct" type="number" step="any" min="0" value="${Math.round((th.near_fraction??.05)*100)}"></label>
  <label class="f">"Muito acima" a partir de (%)<input name="severe_pct" type="number" step="any" min="101" value="${Math.round((th.severe_ratio??1.2)*100)}"></label>
 </div><div class="row" style="margin-top:12px"><button class="primary" id="run" ${a.event_count?'':'disabled'}>${a.analyzed?'Salvar e rodar de novo':'Salvar e rodar análise'}</button></div></form></section>
 </div>
 <div id="results">${m?renderResults(id,m,last):'<section class="card muted">Rode a análise para ver ciclos, Yamazumi e anomalias.</section>'}</div>
 <section class="card"><h2>Observações gerais</h2><p class="muted">Tudo o que você registra aqui fica no histórico da análise e vira base para melhorar o modelo.</p>
  <div class="fields"><label class="f">Seu nome<input id="author" value="${esc(author())}"></label></div><h3></h3>
  <textarea id="note" rows="3" placeholder="Ex.: o operador parou por falta de material no ciclo 5; a câmera não mostra a mão esquerda…"></textarea>
  <div class="row" style="margin-top:8px"><button id="saveNote" class="primary">Registrar observação</button></div>
  ${feedback.filter(f=>f.target_type==='general').reverse().map(f=>`<p class="fb-done">“${esc(f.comment)}” <span class="muted">— ${esc(f.author||'sem nome')}, ${new Date(f.created_at).toLocaleString('pt-BR')}</span></p>`).join('')}
 </section>`;
 document.getElementById('author').onchange=e=>setAuthor(e.target.value);
 loadDataset(id);document.getElementById('exportDataset').onclick=()=>exportDataset(id);
 document.getElementById('del').onclick=async()=>{if(!confirm('Excluir esta análise, o vídeo e as validações? Não dá para desfazer.'))return;await api(`/api/analyses/${id}`,{method:'DELETE'});location.hash='#/'};
 document.getElementById('vid').onchange=async e=>{const fd=new FormData();fd.append('video',e.target.files[0]);toast('Enviando vídeo…');try{await api(`/api/analyses/${id}/video`,{method:'PUT',body:fd});toast('Vídeo salvo');route()}catch(err){toast('Erro: '+err.message)}};
 document.getElementById('csv').onchange=async e=>{try{const r=await api(`/api/analyses/${id}/events`,{method:'PUT',headers:{'Content-Type':'text/csv'},body:await e.target.files[0].text()});toast(r.event_count+' eventos importados');route()}catch(err){toast('CSV inválido: '+err.message)}};
 document.getElementById('params').onsubmit=async e=>{e.preventDefault();const f=e.target;try{
  await api(`/api/analyses/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({takt_time_seconds:+f.takt_time_seconds.value,...(f.standard_cycle_time_seconds.value?{standard_cycle_time_seconds:+f.standard_cycle_time_seconds.value}:{clear_standard_cycle_time:true}),thresholds:{search_seconds:+f.search_seconds.value,waiting_seconds:+f.waiting_seconds.value,near_fraction:f.near_pct.value/100,severe_ratio:f.severe_pct.value/100,mad_z:th.mad_z??3.5}})});
  await api(`/api/analyses/${id}/run`,{method:'POST'});toast('Análise concluída');route()}catch(err){toast('Erro: '+err.message)}};
 document.getElementById('saveNote').onclick=async()=>{const c=document.getElementById('note').value.trim();if(!c)return;await sendFeedback(id,{target_type:'general',comment:c});route()};
 bindFeedback(id);
}
async function sendFeedback(id,body){setAuthor(document.getElementById('author')?.value||author());return api(`/api/analyses/${id}/feedback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({author:appSettings.author||author(),...body})})}
function fbBadge(f){if(!f)return'';const lab={confirmado:['confirmado','ok'],rejeitado:['rejeitado','bad'],corrigir:['corrigir','warn']}[f.verdict]||['registrado','acc'];return `<span class="pill ${lab[1]}">${lab[0]}</span>${f.comment?` <span class="muted fb-done">“${esc(f.comment)}”</span>`:''}`}
function renderResults(id,m,last){
 const st=m.statistics,takt=m.takt.takt_time_seconds,std=m.takt.standard_cycle_time_seconds,above=m.cycles.filter(c=>c.comparison&&['above','severely_above'].includes(c.comparison.classification)).length;
 const firstEvt={};(m.events||[]).forEach(e=>{if(e.cycle_id&&!(e.cycle_id in firstEvt))firstEvt[e.cycle_id]=e.start_time});
 return `<section class="card"><div class="row"><h2 style="margin:0">3. Resultado</h2><span class="spacer"></span><a class="btn" href="/api/analyses/${id}/report">Baixar relatório (.md)</a></div>
 <div class="grid g4" style="margin-top:12px"><div class="kpi"><span>Takt</span><b>${num(takt)} s</b></div>${std?`<div class="kpi"><span>CT padrão</span><b>${num(std)} s</b></div>`:''}<div class="kpi"><span>CT médio medido</span><b>${num(st.mean)} s</b></div>${std&&st.mean!=null?`<div class="kpi"><span>CT médio vs padrão</span><b class="${st.mean>std*1.05?'err':''}">${st.mean>=std?'+':''}${num(st.mean-std)} s (${num(100*st.mean/std,0)}%)</b></div>`:''}${st.mean!=null?`<div class="kpi"><span>CT médio vs takt</span><b class="${st.mean>takt?'err':''}">${num(100*st.mean/takt,0)}% do takt</b></div>`:''}<div class="kpi"><span>CT mediana · P90</span><b>${num(st.median)} · ${num(st.p90)} s</b></div><div class="kpi"><span>Ciclos completos</span><b>${st.n}</b></div><div class="kpi"><span>Ciclos acima do takt</span><b>${above}</b></div><div class="kpi"><span>Anomalias</span><b>${m.anomalies.length}</b></div></div></section>
 <div class="grid g2"><section class="card"><h2>Cycle time por ciclo</h2>${ctChart(m)}</section><section class="card"><h2>Yamazumi (s por categoria)</h2>${yamazumiChart(m)}</section><section class="card"><h2>Tempo por atividade (s/ciclo)</h2>${activityChart(m)}</section></div>
 <section class="card"><h2>4. Valide as anomalias</h2><p class="muted">Confirme o que é real, rejeite falsos alarmes. “Ver no vídeo” abre a rotulagem no início do ciclo.</p>
 ${m.anomalies.length?`<div class="table-wrap"><table><thead><tr><th>Anomalia</th><th>Ciclo</th><th class="n">Valor</th><th>Evidência</th><th>Sua avaliação</th></tr></thead><tbody>${m.anomalies.map((an,i)=>{const key=an.anomaly_type+'@'+an.cycle_ids.join(','),f=last['anomaly:'+key],cid=an.cycle_ids[0];
  return `<tr><td><b>${ANOMALY_LABEL[an.anomaly_type]||an.anomaly_type}</b><div class="muted">${esc(an.description)}</div></td><td>${esc(an.cycle_ids.join(', '))}<div><a href="/labeler/${id}?t=${firstEvt[cid]??0}">Ver no vídeo</a></div></td><td class="n">${an.value!=null?num(an.value)+(an.anomaly_type==='mad_outlier'?' z':' s'):'—'}${an.threshold!=null?`<div class="muted">limite ${num(an.threshold)}</div>`:''}</td><td><span class="pill">${an.evidence_class}</span><div class="muted" style="font-size:12px">${esc(an.event_ids.slice(0,6).join(', '))}${an.event_ids.length>6?'…':''}</div></td>
  <td><div class="row"><button class="ok" data-fb="anomaly" data-key="${esc(key)}" data-v="confirmado">Confirmar</button><button class="bad" data-fb="anomaly" data-key="${esc(key)}" data-v="rejeitado">Rejeitar</button></div><input placeholder="Comentário (opcional)" data-comment="${esc(key)}" style="margin-top:6px"><div style="margin-top:4px">${fbBadge(f)}</div></td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">Nenhuma regra sinalizou anomalias.</p>'}</section>
 <section class="card"><h2>5. Confira os ciclos contra a sua cronometragem</h2><p class="muted">Digite o tempo que você mediu (cronômetro ou vídeo). A diferença mostra se a segmentação está batendo.</p>
 <div class="table-wrap"><table><thead><tr><th>Ciclo</th><th class="n">Início (s)</th><th class="n">CT sistema (s)</th><th>vs takt</th>${std?'<th class="n">vs CT padrão</th>':''}<th class="n">Seu CT (s)</th><th class="n">Diferença</th><th>Ciclo correto?</th></tr></thead><tbody>${m.cycles.map(c=>{const man=last['manual_ct:'+c.cycle_id],ok=last['cycle:'+c.cycle_id],cls=c.comparison?CLASS_LABEL[c.comparison.classification]:['incompleto',''];const diff=man&&c.duration!=null?man.value-c.duration:null;
  return `<tr><td>${c.cycle_id}<div><a href="/labeler/${id}?t=${c.start_time}">Ver no vídeo</a></div></td><td class="n">${num(c.start_time)}</td><td class="n">${num(c.duration)}</td><td><span class="pill ${cls[1]}">${cls[0]}</span></td>${std?`<td class="n">${c.vs_standard?`<span class="${c.vs_standard.ratio>1+(m.thresholds.near_fraction??.05)?'err':''}">${c.vs_standard.deviation_seconds>=0?'+':''}${num(c.vs_standard.deviation_seconds)} s</span>`:'—'}</td>`:''}
  <td class="n"><input type="number" step="any" min="0" style="width:90px;text-align:right" data-manual="${c.cycle_id}" value="${man?.value??''}"></td><td class="n">${diff==null?'—':`<span class="${Math.abs(diff)>Math.max(1,0.05*c.duration)?'err':''}">${diff>0?'+':''}${num(diff)} s</span>`}</td>
  <td><div class="row"><button class="ok" data-fb="cycle" data-key="${c.cycle_id}" data-v="confirmado">Sim</button><button class="bad" data-fb="cycle" data-key="${c.cycle_id}" data-v="corrigir">Corrigir</button></div><div style="margin-top:4px">${fbBadge(ok)}</div></td></tr>`}).join('')}</tbody></table></div></section>`;
}
function bindFeedback(id){
 document.querySelectorAll('[data-fb]').forEach(b=>b.onclick=async()=>{const key=b.dataset.key,comment=document.querySelector(`[data-comment="${CSS.escape(key)}"]`)?.value||'';
  const c=b.dataset.v==='corrigir'?prompt('O que precisa corrigir neste ciclo? (ex.: o fim está 2 s adiantado)')??'':comment;
  await sendFeedback(id,{target_type:b.dataset.fb,target_id:key,verdict:b.dataset.v,comment:c});toast('Validação registrada');route()});
 document.querySelectorAll('[data-manual]').forEach(inp=>inp.onchange=async()=>{if(inp.value==='')return;await sendFeedback(id,{target_type:'manual_ct',target_id:inp.dataset.manual,value:+inp.value});toast('Cronometragem registrada');route()});
}

function datasetSummary(d){
 const el=document.getElementById('datasetSummary'),status=document.getElementById('datasetStatus');if(!el)return;
 status.textContent=`${d.images_saved||0} imagens · ${d.labeled_frames||0} frames rotulados`;
 const parts=(d.per_activity||[]).map(a=>`${esc(a.label||a.code)}: ${a.images||0}`).join(' · ');
 el.innerHTML=`${parts||'Nenhuma imagem exportada.'}${d.folder?`<div style="overflow-wrap:anywhere">Pasta: <code>${esc(d.folder)}</code></div>`:''}<div><a href="/api/analyses/${encodeURIComponent(location.hash.slice(4))}/dataset.zip">Baixar .zip</a></div>`;
}
async function loadDataset(id){try{const d=await api(`/api/analyses/${id}/dataset`);if(d.images_saved==null){const s=document.getElementById('datasetStatus');if(s)s.textContent='Nenhum dataset exportado ainda.';return}datasetSummary(d)}catch(e){const s=document.getElementById('datasetStatus');if(s)s.textContent=e.message==='404'?'Nenhum dataset exportado ainda.':'Resumo indisponível'}}
async function exportDataset(id){const btn=document.getElementById('exportDataset'),step=Math.max(1,parseInt(document.getElementById('datasetStep').value,10)||appSettings.dataset_step||5),width=appSettings.dataset_width||320;btn.disabled=true;try{const d=await api(`/api/analyses/${id}/dataset?step=${step}&width=${width}`,{method:'POST'});datasetSummary(d);toast('Dataset exportado')}catch(e){toast('Erro ao exportar: '+e.message)}finally{btn.disabled=false}}

// Sprint 4b routes and supplementary screens.
async function loadShell(){try{appInfo=await api('/api/info');document.getElementById('sideVersion').textContent='Versão '+(appInfo.version||'—');document.getElementById('sideData').textContent=appInfo.data_dir||''}catch(e){}try{appSettings=await api('/api/settings');document.getElementById('topUser').textContent=appSettings.author||''}catch(e){}}
async function getStations(){try{appStations=(await api('/api/stations')).stations||[]}catch(e){appStations=[]}return appStations}
async function viewDashboard(){const items=await api('/api/analyses'),recent=items.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,5),demo=items.find(a=>a.demo);$app.innerHTML=`<h1>Painel</h1><div class="grid g4">${[['Análises',items.length],['Analisadas',items.filter(a=>a.analyzed).length],['Anomalias abertas',items.reduce((n,a)=>n+(a.anomaly_count||0),0)],['Validações',items.reduce((n,a)=>n+(a.feedback_count||0),0)]].map(([l,v])=>`<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('')}</div>${demo?`<section class="demo-banner"><a href="#/a/${demo.id}">Abrir análise de demonstração</a></section>`:items.length?'':`<section class="card"><h2>Primeiros passos com uma demonstração</h2><button class="primary" id="mkDemo">Criar análise de demonstração</button></section>`}<section class="card"><h2>Análises recentes</h2>${analysisTable(recent)}</section><section class="card"><h2>Primeiros passos</h2><div class="steps"><div class="step">1. Cadastrar posto</div><div class="step">2. Nova análise com vídeo</div><div class="step">3. Rotular</div><div class="step">4. Rodar e validar</div></div></section>`;const b=document.getElementById('mkDemo');if(b)b.onclick=async()=>{try{const x=await api('/api/demo',{method:'POST'});location.hash='#/a/'+x.id}catch(e){toast(e.message)}}}
function analysisTable(items){return items.length?`<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Posto</th><th>Data</th><th>Eventos</th><th>CT médio</th><th>Anomalias</th><th>Validações</th><th>Status</th></tr></thead><tbody>${items.map(a=>`<tr><td><a href="#/a/${a.id}">${esc(a.name)}</a> ${a.demo?'<span class="pill acc">DEMO</span>':''}</td><td>${esc(a.station_id||'—')}</td><td>${a.created_at?new Date(a.created_at).toLocaleDateString('pt-BR'):'—'}</td><td>${a.event_count||0}</td><td>${a.analyzed?num(a.statistics?.mean)+' s':'—'}</td><td>${a.anomaly_count||0}</td><td>${a.feedback_count||0}</td><td><span class="pill ${a.analyzed?'ok':''}">${a.analyzed?'Analisada':'Pendente'}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nenhuma análise cadastrada.</p>'}
async function viewList(){const items=await api('/api/analyses');await getStations();$app.innerHTML=`<div class="row"><h1>Análises</h1><span class="spacer"></span><a class="btn primary" href="#/nova">+ Nova análise</a></div><div class="filter-row"><input id="searchA" placeholder="Buscar por texto"><select id="filterS"><option value="">Todos os postos</option>${appStations.map(s=>`<option value="${esc(s.station_id)}">${esc(s.name||s.station_id)}</option>`).join('')}</select></div><section class="card" id="tableA"></section>`;const draw=()=>{const q=document.getElementById('searchA').value.toLowerCase(),s=document.getElementById('filterS').value;$app.querySelector('#tableA').innerHTML=analysisTable(items.filter(a=>(!s||a.station_id===s)&&(!q||[a.name,a.station_id,a.product_id].join(' ').toLowerCase().includes(q))))};document.getElementById('searchA').oninput=draw;document.getElementById('filterS').onchange=draw;draw()}
async function viewNew(){const [s]=await Promise.all([api('/api/settings'),getStations()]);appSettings=s;$app.innerHTML=`<h1>Nova análise</h1><form id="f" class="card"><div class="fields"><label class="f">Nome *<input name="name" required></label><label class="f">Posto<select id="stationPick"><option value="">— digitar —</option>${appStations.map(x=>`<option value="${esc(x.station_id)}" ${s.default_station_id===x.station_id?'selected':''}>${esc(x.name||x.station_id)}</option>`).join('')}</select></label><label class="f">station_id<input name="station_id" value="${esc(s.default_station_id||'')}"></label><label class="f">Operador<input name="operator_id"></label><label class="f">Produto/modelo<input name="product_id"></label><label class="f">Takt (s)<input name="takt_time_seconds" type="number" step="any" required value="${s.default_takt_seconds??42}"></label><label class="f">CT padrão (s)<input name="standard_cycle_time_seconds" type="number" step="any" value="${s.default_standard_ct_seconds??''}"></label><label class="f">Vídeo<input name="video" type="file" accept="video/*"></label><label class="f">Eventos CSV<input name="events" type="file" accept=".csv,text/csv"></label></div><p class="err" id="err"></p><button class="primary" id="go">Criar análise</button></form>`;const f=document.getElementById('f');document.getElementById('stationPick').onchange=e=>{const x=appStations.find(x=>x.station_id===e.target.value);if(x){f.station_id.value=x.station_id;if(x.takt_time_seconds!=null)f.takt_time_seconds.value=x.takt_time_seconds;if(x.standard_cycle_time_seconds!=null)f.standard_cycle_time_seconds.value=x.standard_cycle_time_seconds}};f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);['video','events'].forEach(k=>{if(!fd.get(k)?.name)fd.delete(k)});const x=new XMLHttpRequest();x.open('POST','/api/analyses');x.onload=()=>{const d=JSON.parse(x.responseText||'{}');if(x.status<300)location.hash='#/a/'+d.id;else document.getElementById('err').textContent=d.detail||'Erro'};x.onerror=()=>document.getElementById('err').textContent='Servidor local fora do ar';x.send(fd)}}
async function viewStations(){const ss=await getStations(),row=s=>`<tr>${[['station_id',s.station_id],['name',s.name],['line',s.line],['takt_time_seconds',s.takt_time_seconds],['standard_cycle_time_seconds',s.standard_cycle_time_seconds],['notes',s.notes]].map(([k,v])=>`<td><input data-k="${k}" value="${esc(v??'')}" ${k.includes('seconds')?'type="number" step="any"':''}></td>`).join('')}<td><button type="button" data-del>Excluir</button></td></tr>`;$app.innerHTML=`<h1>Postos</h1><section class="card"><div class="table-wrap"><table class="activity-table"><thead><tr><th>Posto*</th><th>Nome</th><th>Linha</th><th>Takt (s)</th><th>CT padrão (s)</th><th>Observações</th><th></th></tr></thead><tbody id="stationRows">${ss.map(row).join('')}</tbody></table></div><p id="stationErr" class="err"></p><button id="addS">+ Novo posto</button> <button id="saveS" class="primary">Salvar</button></section>`;const body=document.getElementById('stationRows');body.onclick=e=>{if(e.target.closest('[data-del]'))e.target.closest('tr').remove()};document.getElementById('addS').onclick=()=>body.insertAdjacentHTML('beforeend',row({}));document.getElementById('saveS').onclick=async()=>{const stations=[...body.rows].map(tr=>{const o=Object.fromEntries([...tr.querySelectorAll('[data-k]')].map(x=>[x.dataset.k,x.value]));for(const k of ['takt_time_seconds','standard_cycle_time_seconds'])o[k]=o[k]===''?null:+o[k];return o});try{await api('/api/stations',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({stations})});toast('Postos salvos');route()}catch(e){document.getElementById('stationErr').textContent=e.message}}}
async function viewSettings(){const s=await api('/api/settings');appSettings=s;$app.innerHTML=`<h1>Configurações</h1><form id="sf"><section class="card"><h2>Usuário</h2><label class="f">Autor<input name="author" value="${esc(s.author||'')}"></label></section><section class="card"><h2>Padrões de nova análise</h2><div class="fields">${[['default_station_id','Posto padrão'],['default_takt_seconds','Takt padrão (s)'],['default_standard_ct_seconds','CT padrão (s)'],['default_fps','FPS'],['dataset_step','Passo do dataset'],['dataset_width','Largura do dataset']].map(([k,l])=>`<label class="f">${l}<input name="${k}" value="${esc(s[k]??'')}"></label>`).join('')}</div></section><section class="card"><h2>Limites de anomalia</h2><div class="fields">${['search_seconds','waiting_seconds','mad_z','near_fraction','severe_ratio'].map(k=>`<label class="f">${k}<input name="${k}" value="${s.thresholds?.[k]!=null?s.thresholds[k]*100:''}"></label>`).join('')}</div></section><section class="card"><h2>Sobre</h2>${esc(appInfo.version||'')} · ${esc(appInfo.data_dir||'')}</section><button class="primary">Salvar</button></form>`;document.getElementById('sf').onsubmit=async e=>{e.preventDefault();const f=e.target,v=k=>f.elements[k].value,n=k=>v(k)===''?null:+v(k),body={author:v('author'),default_station_id:v('default_station_id')||null,default_takt_seconds:n('default_takt_seconds'),default_standard_ct_seconds:n('default_standard_ct_seconds'),default_fps:n('default_fps'),dataset_step:n('dataset_step'),dataset_width:n('dataset_width'),thresholds:Object.fromEntries(['search_seconds','waiting_seconds','mad_z','near_fraction','severe_ratio'].map(k=>[k,n(k)]))};for(const k of ['near_fraction','severe_ratio'])if(body.thresholds[k]!=null)body.thresholds[k]/=100;try{await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('Configurações salvas')}catch(err){toast(err.message)}}}
async function viewAnalysis(id){await viewAnalysisLegacy(id);document.getElementById('pageTitle').textContent='Análises › '+($app.querySelector('h1')?.textContent||'');const head=$app.querySelector('.row');if(head)head.insertAdjacentHTML('beforeend',`<a class="btn primary" href="/labeler/${encodeURIComponent(id)}">Abrir rotulagem</a>`);const cards=[...$app.querySelectorAll('.card')],tabs=['Resumo','Vídeo e rotulagem','Validação','Parâmetros'],panes=tabs.map((x,i)=>{const p=document.createElement('div');p.dataset.tabpane=i;return p});cards.forEach(c=>{const t=(c.querySelector('h2')?.textContent||'').toLowerCase(),i=t.includes('parâmetros')?3:t.includes('observações')||t.includes('anomalias')||t.includes('ciclos contra')?2:t.includes('vídeo e eventos')?1:0;panes[i].append(c)});const nav=document.createElement('div');nav.className='tabs';nav.innerHTML=tabs.map((x,i)=>`<button data-tab="${i}" class="${i?'':'active'}">${x}</button>`).join('');head?.after(nav);nav.after(...panes);panes.forEach((p,i)=>{if(i)p.classList.add('hide')});nav.onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;nav.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));panes.forEach(p=>p.classList.toggle('hide',p.dataset.tabpane!==b.dataset.tab))};const a=await api(`/api/analyses/${id}`);if(a.demo){const n=document.createElement('div');n.className='demo-banner';n.textContent='Análise de demonstração com vídeo sintético. O vídeo pode levar alguns segundos para aparecer.';head?.after(n);if(!a.has_video){let c=0;const t=setInterval(async()=>{if(++c>=12){clearInterval(t);return}try{if((await api(`/api/analyses/${id}`)).has_video){clearInterval(t);route()}}catch(e){}},5000)}};const st=document.getElementById('datasetStep');if(st)st.value=appSettings.dataset_step||5;const ex=document.getElementById('exportDataset');if(ex)ex.onclick=()=>exportDataset(id)}

// ---------- Router ----------
async function route(){const h=location.hash||'#/';const titles={'#/analises':'Análises','#/nova':'Nova análise','#/atividades':'Atividades','#/postos':'Postos','#/configuracoes':'Configurações'};document.getElementById('pageTitle').textContent=titles[h]||(h.startsWith('#/a/')?'Análises':'Painel');const nav=h.startsWith('#/a/')?'analises':({'#/analises':'analises','#/nova':'nova','#/atividades':'atividades','#/postos':'postos'}[h]||'painel');document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===nav));document.getElementById('sidebar').classList.remove('open');document.getElementById('sideOverlay').classList.remove('show');try{await loadShell();if(h==='#/nova')await viewNew();else if(h==='#/atividades')await viewActivities();else if(h==='#/postos')await viewStations();else if(h==='#/configuracoes')await viewSettings();else if(h==='#/analises')await viewList();else if(h.startsWith('#/a/'))await viewAnalysis(h.slice(4));else await viewDashboard()}catch(e){$app.innerHTML=`<section class="card"><h2>Algo deu errado</h2><p class="err">${esc(e.message)}</p><a class="btn" href="#/">Voltar</a></section>`}}
document.getElementById('hamb').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('sideOverlay').classList.add('show')};document.getElementById('sideOverlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('sideOverlay').classList.remove('show')};
addEventListener('hashchange',route);route();
</script>
